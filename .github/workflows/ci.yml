name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout lattice-plugin-template
        uses: actions/checkout@v6
        with: { path: lattice-plugin-template }
      - name: checkout lattice-sdk
        uses: actions/checkout@v6
        with: { repository: LatticeNet/lattice-sdk, path: lattice-sdk }
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: |
            lattice-sdk/go.mod
            lattice-plugin-template/system-go/go.mod
      - name: create workspace
        run: go work init ./lattice-sdk ./lattice-plugin-template/system-go
      - name: gofmt
        working-directory: lattice-plugin-template
        run: test -z "$(gofmt -l system-go)"
      - name: test system-go plugin
        working-directory: lattice-plugin-template/system-go
        run: go test -race -cover ./...
      - name: build linux/amd64 system-go plugin
        working-directory: lattice-plugin-template/system-go
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/lattice-plugin-template .
